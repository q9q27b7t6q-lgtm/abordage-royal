<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abordage Royal">
<title>Abordage Royal</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <radialGradient id="gCoin" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffd54a"/><stop offset=".8" stop-color="#d48a12"/><stop offset="1" stop-color="#8a5208"/></radialGradient>
  <linearGradient id="gCoinIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e09a18"/><stop offset="1" stop-color="#ffe17a"/></linearGradient>
  <linearGradient id="gGem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8fdff"/><stop offset=".3" stop-color="#59f0ff"/><stop offset=".7" stop-color="#1c8de0"/><stop offset="1" stop-color="#4b2bc8"/></linearGradient>
  <linearGradient id="gGem2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff7ff"/><stop offset="1" stop-color="#2a6be0"/></linearGradient>
  <linearGradient id="gTro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#f6c033"/><stop offset="1" stop-color="#a86a0c"/></linearGradient>
  <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9d6e6"/><stop offset="1" stop-color="#6f8299"/></linearGradient>
  <linearGradient id="gGoldS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#f3c64d"/><stop offset="1" stop-color="#9a6514"/></linearGradient>
 </defs>
 <symbol id="i-coin" viewBox="0 0 64 64"><circle cx="32" cy="34" r="27" fill="#7a4806"/><circle cx="32" cy="31" r="27" fill="url(#gCoin)"/><circle cx="32" cy="31" r="20" fill="none" stroke="url(#gCoinIn)" stroke-width="3"/><path d="M32 17l4.2 8.6 9.4 1.3-6.8 6.6 1.6 9.4L32 38.5l-8.4 4.4 1.6-9.4-6.8-6.6 9.4-1.3z" fill="#b8730e" opacity=".9"/><path d="M32 15l4.2 8.6 9.4 1.3-6.8 6.6 1.6 9.4L32 36.5l-8.4 4.4 1.6-9.4-6.8-6.6 9.4-1.3z" fill="#fff1a8"/><ellipse cx="22" cy="17" rx="8" ry="4" fill="#fff" opacity=".55" transform="rotate(-30 22 17)"/></symbol>
 <symbol id="i-gem" viewBox="0 0 64 64"><path d="M14 22l10-12h16l10 12-18 32z" fill="#1d3f9a"/><path d="M14 20l10-12h16l10 12-18 32z" fill="url(#gGem)"/><path d="M14 20h36L32 52z" fill="#1a7fd6" opacity=".55"/><path d="M24 8l-4 12h24l-4-12z" fill="#c9fbff" opacity=".8"/><path d="M20 20l12 32 12-32z" fill="url(#gGem2)" opacity=".55"/><path d="M26 12l-3 7h8z" fill="#fff" opacity=".9"/></symbol>
 <symbol id="i-trophy" viewBox="0 0 64 64"><path d="M18 10h28v10c0 10-6 17-14 17s-14-7-14-17z" fill="url(#gTro)"/><path d="M18 14H9c0 9 5 14 12 14M46 14h9c0 9-5 14-12 14" fill="none" stroke="#e6a92a" stroke-width="4"/><rect x="28" y="36" width="8" height="10" fill="#c98d1d"/><path d="M19 50h26l3 8H16z" fill="url(#gTro)"/><rect x="22" y="12" width="5" height="16" rx="2" fill="#fff" opacity=".45"/></symbol>
 <symbol id="i-swords" viewBox="0 0 64 64"><g stroke-linecap="round"><path d="M12 8l30 30" stroke="url(#gSteel)" stroke-width="7"/><path d="M52 8L22 38" stroke="url(#gSteel)" stroke-width="7"/><path d="M36 34l10 10M28 34L18 44" stroke="url(#gGoldS)" stroke-width="7"/><path d="M46 44l8 8M18 44l-8 8" stroke="#5a2e10" stroke-width="7"/><circle cx="55" cy="55" r="4" fill="url(#gGoldS)"/><circle cx="9" cy="55" r="4" fill="url(#gGoldS)"/></g></symbol>
 <symbol id="i-wheel" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="url(#gGoldS)" stroke-width="6"/><circle cx="32" cy="32" r="7" fill="url(#gGoldS)"/><g stroke="url(#gGoldS)" stroke-width="4" stroke-linecap="round"><path d="M32 6v52M6 32h52M13.6 13.6l36.8 36.8M50.4 13.6L13.6 50.4"/></g><g fill="url(#gGoldS)"><circle cx="32" cy="3" r="4"/><circle cx="32" cy="61" r="4"/><circle cx="3" cy="32" r="4"/><circle cx="61" cy="32" r="4"/></g></symbol>
 <symbol id="i-chest" viewBox="0 0 64 64"><path d="M8 28h48v26a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="#8a4a1c"/><path d="M8 28c0-12 10-18 24-18s24 6 24 18z" fill="#b5652a"/><path d="M8 28h48v6H8z" fill="url(#gGoldS)"/><path d="M14 12v46M50 12v46" stroke="url(#gGoldS)" stroke-width="5"/><rect x="26" y="30" width="12" height="14" rx="2" fill="url(#gGoldS)"/><circle cx="32" cy="36" r="2.5" fill="#5a2e10"/></symbol>
 <symbol id="i-isle" viewBox="0 0 64 64"><ellipse cx="32" cy="52" rx="26" ry="8" fill="#e9c47c"/><ellipse cx="32" cy="50" rx="18" ry="5" fill="#59b84a"/><path d="M34 50c0-12-2-22-7-30" stroke="#8a5a2b" stroke-width="4" fill="none"/><path d="M27 20c-8-6-16-4-20 2 6-2 12-1 20-2zM27 20c2-9 10-13 18-11-6 2-12 6-18 11zM27 20c8-3 17 0 21 7-7-3-13-5-21-7zM27 20c-5 2-9 7-10 14 4-6 6-9 10-14z" fill="#3fbf5a"/></symbol>
 <symbol id="i-sound" viewBox="0 0 64 64"><path d="M10 24h10l14-12v40L20 40H10z" fill="#f3c64d"/><path d="M42 22c4 6 4 14 0 20M48 16c8 9 8 23 0 32" stroke="#f3c64d" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
 <symbol id="i-mute" viewBox="0 0 64 64"><path d="M10 24h10l14-12v40L20 40H10z" fill="#8a97ad"/><path d="M42 24l14 16M56 24L42 40" stroke="#e5484d" stroke-width="5" stroke-linecap="round"/></symbol>
 <symbol id="i-hammer" viewBox="0 0 64 64"><path d="M30 26l22 22-6 6-22-22z" fill="#8a5a2b"/><path d="M10 18l12-12 16 16-12 12z" fill="url(#gSteel)"/><path d="M22 6l16 16-3 3L19 9z" fill="#fff" opacity=".5"/></symbol>
 <symbol id="i-barrel" viewBox="0 0 64 64"><ellipse cx="32" cy="12" rx="16" ry="5" fill="#5a3216"/><path d="M16 12c-3 14-3 26 0 40h32c3-14 3-26 0-40z" fill="#a0561f"/><path d="M15 20h34M15 44h34" stroke="#3b3b44" stroke-width="5"/><path d="M38 4c4-2 8 0 9 4" stroke="#ffcf5a" stroke-width="3" fill="none"/><circle cx="48" cy="4" r="4" fill="#ff7a1a"/><text x="32" y="38" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="14" fill="#2a1406">TNT</text></symbol>
 <symbol id="i-volley" viewBox="0 0 64 64"><circle cx="20" cy="40" r="10" fill="#2b2f3a"/><circle cx="38" cy="26" r="9" fill="#2b2f3a"/><circle cx="50" cy="44" r="8" fill="#2b2f3a"/><circle cx="17" cy="37" r="3" fill="#8b93a6"/><circle cx="35" cy="23" r="3" fill="#8b93a6"/><circle cx="48" cy="41" r="2.5" fill="#8b93a6"/><path d="M6 56c8-4 14-6 20-12M24 18c6 2 8 4 10 8" stroke="#ffb340" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
 <symbol id="i-flag" viewBox="0 0 64 64"><path d="M14 6v54" stroke="#6b4a2b" stroke-width="5" stroke-linecap="round"/><path d="M16 8c14-6 22 6 40 0v26c-18 6-26-6-40 0z" fill="#1a1d26"/><circle cx="36" cy="18" r="6" fill="#f2efe6"/><path d="M28 28l16-6M28 22l16 6" stroke="#f2efe6" stroke-width="3"/></symbol>
 <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 4l8.8 18 19.8 2.9-14.3 14 3.4 19.7L32 49.3 14.3 58.6l3.4-19.7L3.4 24.9l19.8-2.9z"/></symbol>
 <symbol id="i-close" viewBox="0 0 64 64"><path d="M18 18l28 28M46 18L18 46" stroke="#fff" stroke-width="8" stroke-linecap="round"/></symbol>
</svg>

<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="fx-layer"></div>
<div id="letterbox"><div class="lb top"></div><div class="lb bot"></div></div>
<div id="flash"></div>

<!-- LOADING -->
<div id="loading">
 <div class="ld-bg"></div>
 <div class="ld-rays"></div>
 <div class="ld-inner">
  <div class="ld-icon"><img src="icon-512.png" alt=""><div class="ld-shine"></div></div>
  <h1 class="title-gold">ABORDAGE<br><span>ROYAL</span></h1>
  <div class="ld-bar"><div class="ld-fill" id="ldFill"></div><div class="ld-pct" id="ldPct">0%</div></div>
  <div class="ld-tip" id="ldTip">Hissez les voiles, capitaine…</div>
  <button class="ld-play" id="ldPlay">TOUCHER POUR JOUER</button>
 </div>
 <div class="ld-foot">Prototype · v0.3</div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
 <div class="hud-top">
  <div class="player">
   <div class="avatar"><img src="icon-192.png" alt=""><div class="lvl" id="pLvl">1</div></div>
   <div class="pinfo">
    <div class="pname">Capitaine Crazy</div>
    <div class="xpbar"><div class="xpfill" id="xpFill"></div><span id="xpTxt">0 / 100</span></div>
   </div>
  </div>
  <div class="res">
   <div class="pill" id="pillGold"><svg class="ic"><use href="#i-coin"/></svg><span id="vGold">0</span><button class="plus" data-open="shop" data-tab="or">+</button></div>
   <div class="pill gem" id="pillGem"><svg class="ic"><use href="#i-gem"/></svg><span id="vGem">0</span><button class="plus" data-open="shop" data-tab="gemmes">+</button></div>
  </div>
 </div>
 <div class="hud-sub">
  <div class="pill small" id="pillTro"><svg class="ic"><use href="#i-trophy"/></svg><span id="vTro">0</span></div>
  <button class="round-btn" id="btnSound"><svg><use href="#i-sound"/></svg></button>
 </div>
 <div class="side-left">
  <button class="side-btn" data-open="wheel" id="sideWheel"><div class="side-ic spin-slow"><svg><use href="#i-wheel"/></svg></div><span>Roue</span><i class="badge" id="wheelBadge">1</i></button>
  <button class="side-btn" id="sideChest"><div class="side-ic" style="padding:6px"><svg viewBox="0 0 64 64"><use href="#i-chest"/></svg></div><span>Coffres</span><i class="badge" id="chestBadge">0</i></button>
  <button class="side-btn" data-open="shop" data-tab="offres"><div class="side-ic"><svg><use href="#i-chest"/></svg></div><span>Offres</span><i class="badge hot">-70%</i></button>
 </div>
 <div class="collect" id="collectBtn"><svg><use href="#i-coin"/></svg><b id="collectAmt">0</b><small>Récolter</small></div>
 <nav class="nav">
  <button class="nav-btn active" data-nav="ile"><svg><use href="#i-isle"/></svg><span>Île</span></button>
  <button class="nav-btn" data-open="wheel"><svg><use href="#i-wheel"/></svg><span>Roue</span></button>
  <button class="raid-btn" id="raidBtn"><div class="raid-ring"></div><svg><use href="#i-swords"/></svg><span>RAID</span></button>
  <button class="nav-btn" data-open="shop" data-tab="offres"><svg><use href="#i-chest"/></svg><span>Boutique</span></button>
  <button class="nav-btn" data-open="skins"><svg><use href="#i-flag"/></svg><span>Skins</span></button>
 </nav>
</div>

<div id="camctl" class="hidden">
 <button id="zIn" aria-label="Zoomer">+</button>
 <button id="zOut" aria-label="Dézoomer">&minus;</button>
 <button id="zMap" aria-label="Vue d'ensemble"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="none" stroke="#f3c64d" stroke-width="5"/><path d="M32 8v48M8 32h48" stroke="#f3c64d" stroke-width="3"/><ellipse cx="32" cy="32" rx="11" ry="24" fill="none" stroke="#f3c64d" stroke-width="3"/></svg></button>
 <button id="zHome" aria-label="Recentrer"><svg><use href="#i-isle"/></svg></button>
</div>

<!-- RAID HUD -->
<div id="rhud" class="hidden">
 <div class="r-top">
  <div class="r-enemy"><div class="r-ename" id="rName">—</div><div class="r-loot"><svg class="ic"><use href="#i-coin"/></svg><span id="rLoot">0</span></div></div>
  <div class="r-timer" id="rTimer">0:45</div>
 </div>
 <div class="r-pct"><div class="r-pct-num" id="rPct">0%</div><div class="r-stars" id="rStars"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div><div class="r-pct-lbl">Destruction</div></div>
 <div class="r-hint" id="rHint">Touche un bâtiment ennemi pour viser</div>
 <div class="r-bottom">
  <button class="r-retreat" id="rRetreat">Retraite</button>
  <div class="r-fleet" id="rFleet"></div>
  <button class="ab" id="abVolley"><div class="ab-cd"></div><svg><use href="#i-volley"/></svg><span>Bordée</span></button>
  <button class="ab" id="abBarrel"><div class="ab-cd"></div><svg><use href="#i-barrel"/></svg><span>Baril ×<b id="barrelN">1</b></span></button>
 </div>
</div>

<div id="banner"><div class="bn-inner"><div class="bn-sub" id="bnSub">RAID</div><div class="bn-title" id="bnTitle">À L'ABORDAGE !</div></div></div>

<!-- MODALS -->
<div id="modal" class="hidden"><div class="m-back"></div><div class="m-wrap" id="mWrap"></div></div>
<div id="toast"></div>

<script type="module" src="js/game.js?v=0.3"></script>
</body>
</html>
