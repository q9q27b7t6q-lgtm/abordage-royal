<style>
:root{--navy:#06142b;--navy2:#0b2347;--navy3:#12335f;--gold:#f3c64d;--gold2:#b8862b;--gold3:#ffe9a3;--sea:#0d4f80;--red:#e5484d;--green:#3ccf7a;--txt:#eaf2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--navy);color:var(--txt);font-family:Nunito,system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:radial-gradient(120% 70% at 50% 0%,#14396b 0%,#081a36 55%,#040c1c 100%);box-shadow:0 0 60px #000}
.gold-text{background:linear-gradient(180deg,#fff4c4 0%,#f3c64d 45%,#a8731c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a2506)}
/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(180deg,#030a18ee,#06142b99);border-bottom:1px solid #f3c64d33;z-index:5}
#hud img{width:42px;height:42px;border-radius:11px;border:2px solid var(--gold);box-shadow:0 0 12px #f3c64d55}
#hud .title{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:15px;white-space:nowrap;line-height:1;flex:1;letter-spacing:.5px}
#hud .title small{display:block;font-family:Cinzel,serif;font-size:10px;color:#9fb6d8;-webkit-text-fill-color:#9fb6d8;letter-spacing:2px;margin-top:3px;filter:none}
.pill{display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#0f2d55,#081a36);border:1.5px solid #f3c64d88;border-radius:20px;padding:4px 10px 4px 5px;font-weight:900;font-size:14px;min-width:64px}
.pill .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.coin{background:radial-gradient(circle at 35% 30%,#fff6c8,#f3c64d 45%,#a8731c);box-shadow:0 0 6px #f3c64d88;color:#5a3a06;font-weight:900}
.troph{background:radial-gradient(circle at 35% 30%,#d9f1ff,#5fb2ff 50%,#1d4f9a);color:#06142b}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
/* screens */
#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h2{font-family:Cinzel,serif;font-weight:800;margin:14px 16px 6px;font-size:20px;letter-spacing:1px}
.sub{margin:0 16px 10px;color:#9fb6d8;font-size:13px}
/* island */
#islandWrap{position:relative;flex:1;min-height:340px;background:radial-gradient(circle at 50% 50%,#0d4f80,#062848)}
#islandSvg{position:absolute;inset:0;width:100%;height:100%}
.bld{cursor:pointer;transition:transform .15s}
.bld:active{transform:scale(.95)}
.lvl-tag{font-family:Nunito;font-weight:900;font-size:13px}
#collectBtn{display:block;margin:10px auto 8px}
#log{margin:0 12px 12px;background:#06142bcc;border:1px solid #f3c64d33;border-radius:14px;padding:8px 12px;font-size:13px;max-height:110px;overflow:auto}
#log div{padding:3px 0;border-bottom:1px solid #ffffff10}
#log div:last-child{border:0}
/* buttons */
.btn{appearance:none;border:0;font-family:Nunito;font-weight:900;font-size:16px;color:#3a2304;padding:12px 22px;border-radius:14px;background:linear-gradient(180deg,#ffe58a 0%,#f3c64d 45%,#c08a24 100%);box-shadow:0 4px 0 #7a520f,0 6px 16px #0008,inset 0 1px 0 #fff8;cursor:pointer;letter-spacing:.3px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a520f,0 2px 8px #0008}
.btn[disabled]{filter:grayscale(.9) brightness(.6);pointer-events:none}
.btn.red{color:#fff;background:linear-gradient(180deg,#ff7b6b,#e5484d 50%,#a3202a);box-shadow:0 4px 0 #5f0f15,0 6px 16px #0008,inset 0 1px 0 #fff6}
.btn.blue{color:#fff;background:linear-gradient(180deg,#6cc4ff,#2b83d6 50%,#164f8f);box-shadow:0 4px 0 #0b2d55,0 6px 16px #0008,inset 0 1px 0 #fff6}
.btn.small{font-size:13px;padding:8px 14px}
/* nav */
#nav{display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(0deg,#030a18,#06142bee);border-top:1px solid #f3c64d44;z-index:5}
#nav button{flex:1;background:none;border:0;color:#8aa3c7;font-family:Nunito;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
#nav button .ni{font-size:24px;filter:grayscale(.6);transition:.2s}
#nav button.on{color:var(--gold)}
#nav button.on .ni{filter:none;transform:translateY(-2px) scale(1.12)}
#nav .raidNav .ni{width:58px;height:58px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#ff8a72,#d42f36 60%,#7b0f17);border:3px solid var(--gold);box-shadow:0 0 18px #ff4b4b88,0 4px 10px #000a;filter:none;font-size:28px}
/* sheet */
#veil{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
#veil.on{display:flex;animation:fade .2s}
.sheet{width:100%;max-width:560px;background:linear-gradient(180deg,#123562,#081a36);border-top:2px solid var(--gold);border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60%)}}
.sheet h3{font-family:Cinzel,serif;margin:0 0 4px;font-size:22px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff14;font-size:15px}
.stat b{color:var(--gold3)}
.stat .up{color:var(--green)}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}
/* raid */
.card{margin:8px 14px;padding:14px;border-radius:18px;background:linear-gradient(160deg,#143d70,#0a1f3f);border:1.5px solid #f3c64d55;box-shadow:0 8px 24px #0007}
.enemyHead{display:flex;align-items:center;gap:12px}
.flag{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:#0006;border:2px solid #e5484d}
.enemyHead .nm{font-family:Cinzel,serif;font-weight:800;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:#0007;border:1px solid #ffffff22;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:800}
#battle{position:relative;height:300px;margin:8px 14px;border-radius:18px;overflow:hidden;border:1.5px solid #f3c64d55;background:linear-gradient(180deg,#0a2a52 0%,#0d4f80 55%,#0a3a63 100%);display:none}
#battle svg{position:absolute;inset:0;width:100%;height:100%}
.hpbar{position:absolute;top:10px;width:42%;height:14px;border-radius:8px;background:#0009;border:1px solid #fff4;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;transition:width .25s}
.hpbar span{position:absolute;inset:0;font-size:10px;font-weight:900;display:grid;place-items:center;text-shadow:0 1px 2px #000}
#hpA{left:10px}#hpA i{background:linear-gradient(90deg,#3ccf7a,#9dffa6)}
#hpE{right:10px}#hpE i{background:linear-gradient(90deg,#ff7b6b,#e5484d)}
.ball{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#888,#111);box-shadow:0 0 6px #ff9a3c;z-index:2;pointer-events:none}
.boom{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle,#fff6c8 0%,#ffb13c 35%,#e5484d 60%,transparent 70%);animation:boom .5s forwards;pointer-events:none;z-index:3}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
#battleMsg{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:Cinzel,serif;font-weight:800;font-size:15px;text-shadow:0 2px 4px #000}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}
/* result */
.result{text-align:center}
.result .big{font-family:'Cinzel Decorative',serif;font-size:34px;font-weight:900;margin:4px 0}
.stars{font-size:44px;letter-spacing:6px;margin:6px 0}
.stars .s{display:inline-block;color:#334;filter:none;animation:pop .4s backwards}
.stars .s.on{color:var(--gold);text-shadow:0 0 14px #f3c64d}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
/* wheel */
#wheelBox{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:18px auto 10px}
#wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px #3a2506,0 0 0 12px var(--gold),0 0 40px #f3c64d66,0 10px 40px #000;transition:transform 5s cubic-bezier(.12,.75,.12,1)}
#pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 3px 3px #000);z-index:2}
#hub{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffe58a,#c08a24 60%,#6b4410);border:3px solid #3a2506;display:grid;place-items:center;overflow:hidden}
#hub img{width:100%;height:100%;object-fit:cover}
.center{text-align:center}
#wheelInfo{color:#9fb6d8;font-size:14px;margin:8px 16px 16px;text-align:center}
/* shop */
.shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 18px}
.item{border-radius:16px;padding:12px 10px;text-align:center;background:linear-gradient(160deg,#173f73,#0a1f3f);border:1.5px solid #f3c64d44;position:relative}
.item .em{font-size:40px;margin:4px 0}
.item .n{font-weight:900;font-size:14px}
.item .p{margin-top:8px}
.tag{position:absolute;top:-8px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:900;padding:3px 7px;border-radius:8px;transform:rotate(6deg)}
.rare{border-color:#b56bff}
.rare .tag{background:#8b3dff}
/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%) translateY(-20px);background:#081a36f2;border:1.5px solid var(--gold);color:var(--gold3);padding:10px 16px;border-radius:14px;font-weight:900;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.flycoin{position:fixed;width:22px;height:22px;border-radius:50%;z-index:50;pointer-events:none;transition:all .7s cubic-bezier(.5,-.3,.7,1)}
.wave{animation:wave 4s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-14px)}}

<div id="veil"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const KEY='abordage-royal-v1';
const today=()=>new Date().toLocaleDateString('fr-CA');
const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

const DEF={coins:1500,troph:0,lv:{tresor:1,canon:1,quai:1},lastCollect:Date.now(),lastSeen:Date.now(),spinDay:'',log:[],enemy:null,wins:0};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));S.lv=Object.assign({},DEF.lv,S.lv)}catch(e){S={...DEF}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

/* ---------- stats ---------- */
const MAXLV=10;
const B={
  tresor:{nom:'Trésor',em:'🏛️',desc:'Produit de l’or en continu. Plus il est haut, plus il rapporte et stocke.',
    stats:l=>[['Production',fmt(prod(l))+' / min'],['Stockage',fmt(cap(l))]]},
  canon:{nom:'Canon',em:'💣',desc:'Défend ton île contre les raids des autres pirates.',
    stats:l=>[['Défense',fmt(power(l))],['Portée',(3+l*.4).toFixed(1)+' encablures']]},
  quai:{nom:'Quai',em:'⚓',desc:'Abrite ta flotte. Plus il est haut, plus tes raids frappent fort.',
    stats:l=>[['Attaque',fmt(power(l))],['Navires',String(Math.min(1+Math.floor(l/2),5))]]}
};
function prod(l){return 20*l+5*l*l}
function cap(l){return 400*l*l+600}
function power(l){return Math.round(30+22*Math.pow(l,1.35))}
function cost(k,l){const base={tresor:250,canon:300,quai:300}[k];return Math.round(base*Math.pow(1.85,l-1)/10)*10}
const shipCount=()=>Math.min(1+Math.floor(S.lv.quai/2),5);

/* ---------- HUD ---------- */
function hud(bump){
  $('#coins').textContent=fmt(S.coins);$('#troph').textContent=fmt(S.troph);
  if(bump){$('#pCoins').classList.remove('bump');void $('#pCoins').offsetWidth;$('#pCoins').classList.add('bump')}
  for(const k in B){$('#t'+k[0].toUpperCase()+k.slice(1)).textContent=B[k].nom+' '+S.lv[k]}
  $('#cannonBarrel').setAttribute('transform',`rotate(${-20-S.lv.canon*2} 95 222)`);
  updPending();save();
}
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400)}
function addLog(t){S.log.unshift(t);S.log=S.log.slice(0,20);renderLog()}
function renderLog(){$('#log').innerHTML=S.log.length?S.log.map(l=>`<div>${l}</div>`).join(''):'<div>📜 Journal de bord vide. Améliore ton île puis pars en raid !</div>'}
function flyCoins(fromEl,n=8){
  const r=fromEl.getBoundingClientRect(),t=$('#pCoins').getBoundingClientRect();
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='flycoin coin';
    c.style.left=(r.left+r.width/2+rnd(-30,30))+'px';c.style.top=(r.top+r.height/2+rnd(-20,20))+'px';document.body.appendChild(c);
    setTimeout(()=>{c.style.left=(t.left+10)+'px';c.style.top=(t.top+6)+'px';c.style.transform='scale(.6)'},30+i*50);
    setTimeout(()=>c.remove(),900+i*50)}
  setTimeout(()=>hud(true),700);
}

/* ---------- island ---------- */
// palms
(()=>{const P=[[110,190],[300,160],[320,290],[140,320],[255,300],[175,150]];let h='';
 for(const [x,y] of P){h+=`<g class="bob" style="animation-delay:${Math.random()*2}s"><path d="M${x} ${y} q3 -18 -2 -34" stroke="#7a4a22" stroke-width="4" fill="none"/>
 <g fill="#2fb35a" stroke="#1a6b35" stroke-width="1"><path d="M${x-2} ${y-34} q-18 -6 -24 6 q12 -4 24 -6z"/><path d="M${x-2} ${y-34} q18 -8 24 4 q-12 -3 -24 -4z"/><path d="M${x-2} ${y-34} q-6 -16 6 -20 q-2 10 -6 20z"/><path d="M${x-2} ${y-34} q-14 4 -14 18 q6 -10 14 -18z"/><path d="M${x-2} ${y-34} q14 2 16 16 q-8 -10 -16 -16z"/></g></g>`}
 $('#palms').innerHTML=h})();
function pendingAmt(){return Math.min(cap(S.lv.tresor),(Date.now()-S.lastCollect)/60000*prod(S.lv.tresor))}
function updPending(){const p=pendingAmt();$('#pending').textContent=fmt(p);$('#collectBtn').disabled=p<1;
  const n=Math.min(6,Math.floor(p/cap(S.lv.tresor)*6+ (p>0?1:0)));let h='';for(let i=0;i<n;i++)h+=`<circle cx="${170+i*12}" cy="${210-(i%2)*4}" r="6" fill="url(#goldG)" stroke="#6b4410"/>`;$('#coinPile').innerHTML=h}
$('#collectBtn').onclick=e=>{const p=Math.floor(pendingAmt());if(p<1)return;S.coins+=p;S.lastCollect=Date.now();flyCoins(e.currentTarget,10);toast(`+${fmt(p)} pièces récoltées`)};
setInterval(updPending,1000);

document.querySelectorAll('.bld').forEach(g=>g.addEventListener('click',()=>openBld(g.dataset.b)));
function openBld(k){
  const l=S.lv[k],b=B[k],c=cost(k,l),max=l>=MAXLV;
  const cur=b.stats(l),nxt=max?null:b.stats(l+1);
  $('#sheet').innerHTML=`<h3 class="gold-text">${b.em} ${b.nom} — niv. ${l}</h3><p class="sub" style="margin:0 0 8px">${b.desc}</p>
   ${cur.map((s,i)=>`<div class="stat"><span>${s[0]}</span><span><b>${s[1]}</b>${nxt?` <span class="up">→ ${nxt[i][1]}</span>`:''}</span></div>`).join('')}
   <div class="row"><button class="btn blue" id="shClose">Fermer</button>
   ${max?'<button class="btn" disabled>Niveau max</button>':`<button class="btn" id="shUp" ${S.coins<c?'disabled':''}>Améliorer · ${fmt(c)} 🪙</button>`}</div>
   ${!max&&S.coins<c?`<p class="sub center" style="margin-top:10px">Il te manque ${fmt(c-S.coins)} pièces — pars en raid ou tourne la roue !</p>`:''}`;
  $('#veil').classList.add('on');
  $('#shClose').onclick=closeSheet;
  const u=$('#shUp');if(u)u.onclick=()=>{if(k==='tresor'){S.coins+=Math.floor(pendingAmt());S.lastCollect=Date.now()}
    S.coins-=c;S.lv[k]++;hud(true);closeSheet();toast(`✨ ${b.nom} amélioré au niveau ${S.lv[k]} !`);addLog(`🔨 ${b.nom} passé niveau ${S.lv[k]}`);
    const g=document.querySelector(`.bld[data-b="${k}"]`);g.classList.remove('shake');void g.getBoundingClientRect();g.classList.add('shake')};
}
function closeSheet(){$('#veil').classList.remove('on')}
$('#veil').addEventListener('click',e=>{if(e.target.id==='veil'&&!battleOn)closeSheet()});

/* ---------- mock incoming raids (simulated PvP) ---------- */
const NAMES=['Barbe-Grise','Capitaine Kraken','La Veuve Noire','Jack Tempête','Morgane la Rouge','Le Borgne','Sabre d’Or','Rackham Junior','Anne Écume','Le Corsaire Fou','Lady Corail','Dent-de-Requin','Black Ruby','Hector Brisemâts','Isla Tonnerre'];
const ISLES=['Île du Crâne','Récif Maudit','Baie des Brumes','Atoll d’Ébène','Crique Sanglante','Île aux Perles','Roc du Kraken','Lagon Doré','Port-Fantôme','Îlot des Sirènes'];
const FLAGS=['☠️','🦜','🐙','🦈','🐉','⚓','🗡️','👑'];
(function incoming(){
  const away=(Date.now()-S.lastSeen)/60000;
  if(S.log.length && away>8){
    const n=Math.min(3,1+Math.floor(away/120));
    for(let i=0;i<n;i++){
      const atk=power(Math.max(1,S.lv.canon+ri(-2,1)))*rnd(.8,1.25),def=power(S.lv.canon);
      const nm=pick(NAMES);
      if(atk>def){const lost=Math.floor(Math.min(S.coins*.08,250*S.lv.tresor));S.coins-=lost;S.troph=Math.max(0,S.troph-ri(5,12));addLog(`🛡️❌ ${nm} t’a pillé ${fmt(lost)} pièces pendant ton absence`)}
      else{const g=ri(4,10);S.troph+=g;addLog(`🛡️✅ Tes canons ont repoussé ${nm} (+${g} 🏆)`)}
    }
    setTimeout(()=>toast('📜 Des pirates ont attaqué ton île pendant ton absence !'),600);
  }
  S.lastSeen=Date.now();setInterval(()=>{S.lastSeen=Date.now();save()},15000);
})();

/* ---------- raid ---------- */
function newEnemy(){
  const my=Math.round((S.lv.canon+S.lv.quai+S.lv.tresor)/3);
  const l=Math.max(1,my+ri(-1,1));
  const def=Math.round(power(l)*rnd(.75,1.25));
  const loot=Math.round((ri(250,500)*l+S.troph*2)/10)*10;
  S.enemy={nm:pick(NAMES),isle:pick(ISLES),flag:pick(FLAGS),l,def,loot,troph:Math.max(0,S.troph+ri(-60,80))};save();
}
function renderEnemy(){
  if(!S.enemy)newEnemy();const e=S.enemy,atk=power(S.lv.quai);
  const ratio=atk/e.def,diff=ratio>1.25?['Facile','#3ccf7a']:ratio>.9?['Équilibré','#f3c64d']:['Dangereux','#e5484d'];
  $('#enemyCard').innerHTML=`<div class="enemyHead"><div class="flag">${e.flag}</div><div style="flex:1"><div class="nm gold-text">${e.isle}</div><div class="sub" style="margin:2px 0 0">Capitaine <b style="color:#eaf2ff">${e.nm}</b> · 🏆 ${fmt(e.troph)} · niv. ${e.l}</div></div></div>
   <div class="chips"><span class="chip">💰 Butin : <span style="color:#ffe9a3">${fmt(e.loot)}</span></span><span class="chip">💣 Défense : ${fmt(e.def)}</span><span class="chip">⚓ Ton attaque : ${fmt(atk)}</span><span class="chip" style="color:${diff[1]}">● ${diff[0]}</span></div>`;
  $('#nextBtn').disabled=S.coins<50;
}
$('#nextBtn').onclick=()=>{if(S.coins<50)return;S.coins-=50;newEnemy();hud(true);renderEnemy();const c=$('#enemyCard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')};
let battleOn=false;
$('#attackBtn').onclick=startBattle;
function shipSvg(x,y,i){return `<g class="ship" data-i="${i}" transform="translate(${x} ${y})"><g class="bob" style="animation-delay:${i*.3}s"><path d="M-22 0 L22 0 L15 12 L-15 12Z" fill="#2a1a10" stroke="#f3c64d" stroke-width="1.2"/><rect x="-1" y="-30" width="2.5" height="31" fill="#3a2506"/><path d="M-13 -26 Q0 -21 13 -26 L12 -4 Q0 1 -12 -4Z" fill="#101624" stroke="#f3c64d" stroke-width=".8"/><circle cx="0" cy="-15" r="3.5" fill="#eaf2ff"/><path class="flagwave" d="M1 -30 l9 3 l-9 3z" fill="#e5484d"/></g></g>`}
function startBattle(){
  if(battleOn)return;battleOn=true;
  const e=S.enemy,atk=power(S.lv.quai),n=shipCount();
  $('#raidBtns').style.display='none';const bt=$('#battle');bt.style.display='block';
  bt.scrollIntoView({behavior:'smooth',block:'center'});
  let fl='';for(let i=0;i<n;i++)fl+=shipSvg(0,0,i);$('#fleet').innerHTML=fl;
  const ships=[...document.querySelectorAll('#fleet .ship')];
  ships.forEach((s,i)=>{const y=80+i*(160/Math.max(n,1));s.removeAttribute('transform');s.style.transform=`translate(-40px,${y}px)`;s.style.transition='transform 1.6s ease-out';requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translate(${150+ri(-25,40)}px,${y}px)`}))});
  let hpA=100+atk*3,hpE=100+e.def*3;const A0=hpA,E0=hpE;
  const setBars=()=>{$('#hpA i').style.width=Math.max(0,hpA/A0*100)+'%';$('#hpE i').style.width=Math.max(0,hpE/E0*100)+'%'};setBars();
  $('#battleMsg').textContent='🏴‍☠️ Approche de l’île...';
  let tick=0;const TICKS=14;
  setTimeout(function loop(){
    tick++;
    $('#battleMsg').textContent=tick<4?'💥 Feu à volonté !':tick<9?'⚔️ Abordage en cours !':'🔥 Dernier assaut !';
    const box=bt.getBoundingClientRect(),sx=box.width/400,sy=box.height/300;
    // our shots
    const dA=atk*rnd(.55,1.15)*(1+tick*.04),dE=e.def*rnd(.5,1.1);
    const from=pick(ships)||null;
    shoot(bt,170*sx,(80+Math.random()*130)*sy,rnd(290,370)*sx,rnd(110,190)*sy);
    setTimeout(()=>{shoot(bt,rnd(290,340)*sx,rnd(130,180)*sy,rnd(140,190)*sx,rnd(60,230)*sy)},180);
    setTimeout(()=>{hpE-=dA;hpA-=dE;setBars();if(Math.random()<.5){bt.classList.remove('shake');void bt.offsetWidth;bt.classList.add('shake')}
      if(hpA<=A0*.5&&ships.length>1&&Math.random()<.35){const s=ships.pop();s.style.transition='opacity .6s';s.style.opacity='0'}
      if(hpE<=0||hpA<=0||tick>=TICKS){setTimeout(()=>endBattle(Math.max(0,1-hpE/E0),hpA>0),500)}else setTimeout(loop,330)},420);
  },1500);
}
function shoot(bt,x1,y1,x2,y2){
  const b=document.createElement('div');b.className='ball';b.style.left=x1+'px';b.style.top=y1+'px';bt.appendChild(b);
  b.animate([{left:x1+'px',top:y1+'px'},{left:(x1+x2)/2+'px',top:Math.min(y1,y2)-40+'px',offset:.5},{left:x2+'px',top:y2+'px'}],{duration:400,easing:'ease-in'});
  setTimeout(()=>{b.remove();const m=document.createElement('div');m.className='boom';m.style.left=x2+'px';m.style.top=y2+'px';bt.appendChild(m);setTimeout(()=>m.remove(),500)},390);
}
function endBattle(destr,alive){
  const e=S.enemy;destr=Math.min(1,destr);
  const stars=destr>=1?3:destr>=.75?2:destr>=.5?1:0;const win=stars>0;
  const loot=Math.floor(e.loot*(win?Math.max(destr,.5):destr*.3));
  const dt=win?ri(8,14)+stars*4:-ri(6,12);
  S.coins+=loot;S.troph=Math.max(0,S.troph+dt);if(win)S.wins++;
  addLog(win?`⚔️✅ Raid sur ${e.isle} : ${stars}★, +${fmt(loot)} pièces`:`⚔️❌ Raid raté sur ${e.isle}${loot?` (+${fmt(loot)} grappillés)`:''}`);
  $('#sheet').innerHTML=`<div class="result"><div class="big ${win?'gold-text':''}" style="${win?'':'color:#ff7b6b'}">${win?'VICTOIRE !':'DÉFAITE'}</div>
    <div class="stars">${[0,1,2].map(i=>`<span class="s ${i<stars?'on':''}" style="animation-delay:${.2+i*.25}s">★</span>`).join('')}</div>
    <div class="sub" style="margin:0">${Math.round(destr*100)}% de l’île détruite</div>
    <div class="stat"><span>Or pillé</span><b>+${fmt(loot)} 🪙</b></div>
    <div class="stat"><span>Trophées</span><b style="color:${dt>=0?'#3ccf7a':'#ff7b6b'}">${dt>=0?'+':''}${dt} 🏆</b></div>
    ${win?'':'<p class="sub" style="margin-top:10px">Astuce : améliore ton Quai pour frapper plus fort.</p>'}
    <div class="row"><button class="btn" id="resOk">Retour au port</button></div></div>`;
  $('#veil').classList.add('on');
  $('#resOk').onclick=()=>{closeSheet();battleOn=false;$('#battle').style.display='none';$('#raidBtns').style.display='flex';newEnemy();renderEnemy();if(loot)flyCoins($('#enemyCard'),12);else hud()};
  hud();
}

/* ---------- wheel ---------- */
const SEG=[{v:100,c:'#12335f'},{v:500,c:'#7a1f24'},{v:150,c:'#0b2347'},{v:1000,c:'#1f6b4a'},{v:200,c:'#12335f'},{v:5000,c:'#8a5a10',j:1},{v:250,c:'#0b2347'},{v:750,c:'#5a2a7a'}];
const W=[22,12,20,6,18,1.5,16,8];
const cv=$('#wheel'),cx=cv.getContext('2d');
function drawWheel(){
  const R=340,n=SEG.length,a=Math.PI*2/n;cx.clearRect(0,0,680,680);
  SEG.forEach((s,i)=>{const a0=-Math.PI/2-a/2+i*a;
    cx.beginPath();cx.moveTo(R,R);cx.arc(R,R,R-4,a0,a0+a);cx.closePath();
    const g=cx.createRadialGradient(R,R,40,R,R,R);g.addColorStop(0,s.j?'#fff1b0':'#ffffff22');g.addColorStop(.35,s.c);g.addColorStop(1,s.j?'#3a2506':'#030a18');
    cx.fillStyle=g;cx.fill();cx.strokeStyle='#f3c64d';cx.lineWidth=4;cx.stroke();
    cx.save();cx.translate(R,R);cx.rotate(a0+a/2);cx.textAlign='right';cx.textBaseline='middle';
    cx.font='900 46px Nunito, sans-serif';cx.lineWidth=8;cx.strokeStyle='#000a';cx.strokeText(s.j?'JACKPOT':fmt(s.v),R-34,0);
    const tg=cx.createLinearGradient(0,-24,0,24);tg.addColorStop(0,'#fff4c4');tg.addColorStop(1,'#f3c64d');cx.fillStyle=tg;cx.fillText(s.j?'JACKPOT':fmt(s.v),R-34,0);
    if(s.j){cx.font='900 30px Nunito';cx.fillText(fmt(s.v),R-60,38)}
    cx.restore()});
  for(let i=0;i<n*2;i++){const an=i*Math.PI/n-Math.PI/2;cx.beginPath();cx.arc(R+Math.cos(an)*(R-14),R+Math.sin(an)*(R-14),7,0,7);cx.fillStyle=i%2?'#fff4c4':'#f3c64d';cx.fill()}
}
drawWheel();document.fonts&&document.fonts.ready.then(drawWheel);
let rot=0,spinning=false;
function wheelState(){const free=S.spinDay!==today();$('#spinBtn').disabled=!free||spinning;
  $('#spinBtn').textContent=free?'TOURNER':'DÉJÀ TOURNÉE';
  if(!free&&!spinning){const t=new Date();t.setHours(24,0,0,0);const ms=t-Date.now();$('#wheelInfo').textContent=`Prochain tour gratuit dans ${Math.floor(ms/3600000)} h ${Math.floor(ms/60000)%60} min`}
  else if(free)$('#wheelInfo').textContent='🎁 Ton tour gratuit du jour est disponible !'}
$('#spinBtn').onclick=()=>{
  if(spinning||S.spinDay===today())return;spinning=true;S.spinDay=today();save();wheelState();
  let r=Math.random()*W.reduce((a,b)=>a+b),i=0;while(r>W[i]){r-=W[i];i++}
  const a=360/SEG.length,target=360-i*a+rnd(-a*.35,a*.35);
  rot=rot-(rot%360)+360*6+target;cv.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{spinning=false;const v=SEG[i].v;S.coins+=v;addLog(`🎡 Roue du jour : +${fmt(v)} pièces${SEG[i].j?' — JACKPOT !':''}`);
    toast(SEG[i].j?`🎉 JACKPOT ! +${fmt(v)} pièces`:`🎡 +${fmt(v)} pièces !`);flyCoins($('#wheelBox'),SEG[i].j?20:10);wheelState()},5100);
};
$('#wheelReset').onclick=()=>{if(spinning)return;S.spinDay='';save();wheelState();toast('Tour gratuit réactivé (mode test)')};
setInterval(()=>{if($('#s-roue').classList.contains('on'))wheelState()},30000);

/* ---------- shop (mock) ---------- */
const SHOP=[
  {em:'🪙',n:'Bourse de pièces',d:'2 500 pièces',p:'0,99 €',give:2500},
  {em:'💰',n:'Coffre de pièces',d:'15 000 pièces',p:'4,99 €',give:15000,tag:'+20%'},
  {em:'🏴‍☠️',n:'Voiles Spectrales',d:'Skin navire',p:'2,99 €',rare:1,tag:'RARE'},
  {em:'👑',n:'Capitaine Royal',d:'Skin pirate',p:'6,99 €',rare:1,tag:'ÉPIQUE'},
  {em:'⚡',n:'Boost Raid x2',d:'Butin doublé 1 h',p:'1,99 €'},
  {em:'🛡️',n:'Bouclier 24 h',d:'Aucun raid subi',p:'2,49 €'},
  {em:'🐉',n:'Figure de proue Dragon',d:'Effet de raid',p:'3,99 €',rare:1,tag:'NOUVEAU'},
  {em:'🎟️',n:'Passe Pirate',d:'Saison 1 — 30 jours',p:'9,99 €',tag:'MEILLEUR'}];
$('#shopGrid').innerHTML=SHOP.map((s,i)=>`<div class="item ${s.rare?'rare':''}">${s.tag?`<span class="tag">${s.tag}</span>`:''}<div class="em">${s.em}</div><div class="n">${s.n}</div><div class="sub" style="margin:2px 0 0;font-size:12px">${s.d}</div><button class="btn small p" data-i="${i}">${s.p}</button></div>`).join('');
$('#shopGrid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=SHOP[b.dataset.i];
  if(s.give){S.coins+=s.give;flyCoins(b,10);toast(`(maquette) +${fmt(s.give)} pièces — aucun paiement`)}else toast(`(maquette) « ${s.n} » arrive bientôt`)});
$('#hardReset').onclick=()=>{if(confirm('Remettre la partie à zéro ?')){localStorage.removeItem(KEY);location.reload()}};

/* ---------- nav ---------- */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(battleOn)return;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.s));
  if(b.dataset.s==='raid')renderEnemy();if(b.dataset.s==='roue')wheelState()});

if(!S.log.length)setTimeout(()=>toast('🏴‍☠️ Bienvenue Capitaine ! Touche un bâtiment pour l’améliorer.'),500);
renderLog();hud();wheelState();
})();
</script>
